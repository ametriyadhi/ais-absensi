server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 256M;

    # Logging
    access_log /var/log/nginx/absensi_access.log;
    error_log /var/log/nginx/absensi_error.log;

    # Security: Blokir akses langsung ke direktori sensitif
    location ~ ^/(config|includes|database|vendor)/ {
        deny all;
        return 404;
    }

    # Security: Blokir eksekusi file PHP di folder uploads
    location ~* /uploads/.*\.php$ {
        deny all;
        return 404;
    }

    # Security: Blokir file tersembunyi (.git, .env, dll)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Security: Blokir create_admin.php di production
    location = /create_admin.php {
        deny all;
        return 404;
    }

    # Static assets caching - images & fonts
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # CSS and JS - revalidate to prevent stale UI
    location ~* \.(css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }


    # Default location
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM processing
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 300;
    }
}
